name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: '23 7 * * 1'
  workflow_dispatch:
    inputs:
      fresh_dependencies:
        description: Start with a fresh Gradle dependency cache
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wrapper-validation:
    name: Gradle wrapper validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@4733eaac7c1b0da527e4206b7671e0061de1ce37 # v6

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      GRADLE_USER_HOME: ${{ runner.temp }}/jgnash-gradle-home
      # The reviewed H2 1.3 fixture was created in this zone; legacy DATE values are zone-sensitive.
      JAVA_TOOL_OPTIONS: -Duser.timezone=America/New_York
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-15-intel
          - macos-15

    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@4733eaac7c1b0da527e4206b7671e0061de1ce37 # v6
        with:
          cache-disabled: ${{ github.event_name == 'schedule' || inputs.fresh_dependencies == true }}

      - name: Run verification
        if: runner.os != 'Windows'
        run: ./gradlew build-logic:test resolveAllDependencies build-logic:resolveAllDependencies clean check --warning-mode=fail --no-daemon --stacktrace

      - name: Run verification
        if: runner.os == 'Windows'
        run: .\gradlew.bat build-logic:test resolveAllDependencies build-logic:resolveAllDependencies clean check --warning-mode=fail --no-daemon --stacktrace

      - name: Verify standalone build-logic dependencies
        if: runner.os != 'Windows'
        run: ./gradlew -p build-logic resolveAllDependencies --warning-mode=fail --no-daemon --stacktrace

      - name: Verify standalone build-logic dependencies
        if: runner.os == 'Windows'
        run: .\gradlew.bat -p build-logic resolveAllDependencies --warning-mode=fail --no-daemon --stacktrace

      - name: Upload verification reports on failure
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: test-reports-${{ matrix.os }}
          path: |
            **/build/test-results/**
            **/build/reports/tests/**
            **/build/reports/dependency-verification/**
          if-no-files-found: warn
